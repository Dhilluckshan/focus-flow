services:
  backend:
    build: ./api
    ports: ["3001:3001"]
    environment:
      DATABASE_URL: file:/data/focusflow.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes: ["task-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/tasks').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 15
  frontend:
    build: ./web
    ports: ["3000:3000"]
    environment:
      API_INTERNAL_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
volumes:
  task-data:
