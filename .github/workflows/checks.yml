name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix api
      - run: npm ci --prefix web
      - run: node api/node_modules/prisma/build/index.js generate --schema api/prisma/schema.prisma
      - run: npm run build
      - run: npm run test:isolated
      - run: npm audit --prefix api --audit-level high
      - run: npm audit --prefix web --audit-level high
      - run: docker compose build
