name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: node backend/node_modules/prisma/build/index.js generate --schema backend/prisma/schema.prisma
      - run: npm run build
      - run: npm run test:isolated
      - run: npm audit --prefix backend --audit-level high
      - run: npm audit --prefix frontend --audit-level high
      - run: docker compose build
